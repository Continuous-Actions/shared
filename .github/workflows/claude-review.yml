# Reusable PR review by Claude. Called from each repo's .github/workflows/claude-review.yml.
# Triggered when a PR (draft or not) is opened, marked ready or pushed to, or when the @continuous-actions/claude-review team is requested as reviewer.
name: Claude Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    name: run
    # Dependabot-triggered runs get no org secrets, so the review can't authenticate; skip them
    # (request the claude-review team on a Dependabot PR to review it with your own credentials).
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check Claude token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty. Re-create it with 'claude setup-token' and save it with 'gh secret set CLAUDE_CODE_OAUTH_TOKEN --org continuous-actions --visibility all'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent mode for every event: tag mode (track_progress) uses a different tool set in which
          # `gh pr review` is denied, so reviews ended as comments instead of approvals.
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are "claude", a code reviewer for this pull request.
            Read the diff (`gh pr diff`) and the PR description (`gh pr view`), and look at surrounding code as needed.

            Focus on, in order:
            - Correctness bugs and edge cases
            - Security issues
            - Performance problems
            - Missing or weak tests
            - Readability / maintainability (only where it matters)

            Follow any conventions in CLAUDE.md / AGENTS.md if present.
            Post specific issues as inline comments with `mcp__github_inline_comment__create_inline_comment`.
            Finish by submitting exactly one review with a short summary of the most important findings.
            First write the summary to the file `review.md` with the Write tool, then run exactly one of
            (never use `$(...)`, heredocs, pipes or `--body` with inline text; those are blocked):
            - `gh pr review ${{ github.event.pull_request.number }} --approve --body-file review.md` if there are no blocking issues.
            - `gh pr review ${{ github.event.pull_request.number }} --request-changes --body-file review.md` if there are correctness bugs, security issues or other problems that must be fixed before merging.
            - `gh pr review ${{ github.event.pull_request.number }} --comment --body-file review.md` only if you cannot reach a verdict (e.g. the PR is a draft that is clearly incomplete).
            Not being able to run the build or tests is not a reason to withhold a verdict: judge the diff, and say in the summary what you could not verify.
            Be concise. Do not comment on things that are fine.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Write,Grep,Glob"

      # Clear the pending team request so the PR doesn't show "claude-review" as still awaiting review.
      - name: Clear review request
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '{"reviewers":[],"team_reviewers":["claude-review"]}' |
            gh api -X DELETE "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" --input -
