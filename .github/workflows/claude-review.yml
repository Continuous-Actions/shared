# Reusable PR review by Claude. Called from each repo's .github/workflows/claude-review.yml.
# Triggered when a PR (draft or not) is opened, marked ready or pushed to, or when the @OpenMind-SI/claude-review team is requested as reviewer.
name: Claude Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    name: Code review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are "claude", a code reviewer for this pull request.
            Read the diff (`gh pr diff`) and the PR description (`gh pr view`), and look at surrounding code as needed.

            Focus on, in order:
            - Correctness bugs and edge cases
            - Security issues
            - Performance problems
            - Missing or weak tests
            - Readability / maintainability (only where it matters)

            Follow any conventions in CLAUDE.md / AGENTS.md if present.
            Post specific issues as inline comments with `mcp__github_inline_comment__create_inline_comment`.
            Finish with one top-level summary via `gh pr comment`: a short verdict and the most important findings.
            Be concise. Do not comment on things that are fine.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      # Clear the pending team request so the PR doesn't show "claude-review" as still awaiting review.
      - name: Clear review request
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" \
            -f 'team_reviewers[]=claude-review'
